<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Orbital rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>

  <!-- Desktop PC node icon (Left-top) -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="70" height="48" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
    <line x1="35" y1="48" x2="35" y2="60" stroke="#06b6d4" stroke-width="3"/>
    <line x1="20" y1="60" x2="50" y2="60" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="24" r="6" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Mobile phone node icon (Right-bottom) -->
  <g transform="translate(300, 270)">
    <rect x="0" y="0" width="46" height="78" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <circle cx="23" cy="65" r="4" fill="#10b981"/>
    <line x1="16" y1="10" x2="30" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="38" r="8" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- High-speed transfer beam with arrow particles -->
  <path d="M 215 200 C 270 200, 240 310, 295 310" fill="none" stroke="url(#cyan-beam)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 295 310 C 240 310, 270 200, 215 200" fill="none" stroke="url(#emerald-glow)" stroke-width="4" stroke-dasharray="10 14" stroke-linecap="round"/>

  <!-- Center Security Lock / Shield -->
  <g transform="translate(236, 236)">
    <circle cx="20" cy="20" r="26" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    <path d="M 14 18 L 14 14 C 14 10.7 16.7 8 20 8 C 23.3 8 26 10.7 26 14 L 26 18 M 12 18 L 28 18 C 29.1 18 30 18.9 30 20 L 30 29 C 30 30.1 29.1 31 28 31 L 12 31 C 10.9 31 10 30.1 10 29 L 10 20 C 10 18.9 10.9 18 12 18 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
